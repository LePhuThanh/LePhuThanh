<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="240"
    height="70"
    viewBox="0 0 240 70">
    <!-- ===================================================== -->
    <!-- DEFINITIONS                                           -->
    <!-- ===================================================== -->
    <defs>
        <!-- Background -->
        <linearGradient
            id="widgetBackground"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">
            <stop
                offset="0%"
                stop-color="#1B2330"/>
            <stop
                offset="100%"
                stop-color="#111827"/>
        </linearGradient>
        <!-- Border -->
        <linearGradient
            id="widgetBorder"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%">
            <stop
                offset="0%"
                stop-color="#2F81F7"
                stop-opacity="0.15"/>
            <stop
                offset="50%"
                stop-color="#3B4450"
                stop-opacity="0.15"/>
            <stop
                offset="100%"
                stop-color="#2F81F7"
                stop-opacity="0.15"/>
        </linearGradient>
        <!-- Glass -->
        <linearGradient
            id="widgetGlass"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">
            <stop
                offset="0%"
                stop-color="#FFFFFF"
                stop-opacity="0.09"/>
            <stop
                offset="100%"
                stop-color="#FFFFFF"
                stop-opacity="0.00"/>
        </linearGradient>
    </defs>
    <!-- ===================================================== -->
    <!-- CONTAINER                                             -->
    <!-- ===================================================== -->
    <!-- Glass Card -->
    <rect
        x="1"
        y="1"
        width="238"
        height="68"
        rx="10"
        ry="10"
        fill="url(#widgetBackground)"
        stroke="url(#widgetBorder)"
        stroke-width="1"
        stroke-opacity="0.40"/>
    <!-- Glass Overlay -->
    <rect
        x="1"
        y="1"
        width="238"
        height="68"
        rx="10"
        ry="10"
        fill="url(#widgetGlass)"/>
    <!-- Inner Border -->
    <rect
        x="5"
        y="5"
        width="230"
        height="60"
        rx="8"
        ry="8"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.03"
        stroke-width="0.8"/>
    <!-- ===================================================== -->
    <!-- BUILD PIPELINE TITLE                                  -->
    <!-- ===================================================== -->
    <g id="pipeline-title">
        <text
            x="16"
            y="19"
            font-family="Consolas, 'Courier New', monospace"
            font-size="9"
            font-weight="700"
            letter-spacing="1.5"
            fill="#8B949E">
            BUILD PIPELINE
        </text>
        <!-- Status Indicator -->
        <circle
            cx="222"
            cy="14"
            r="2.2"
            fill="#3FB950">
            <animate
                attributeName="opacity"
                values="1;0.35;1"
                dur="2s"
                repeatCount="indefinite"/>
        </circle>
    </g>
    <!-- ===================================================== -->
    <!-- PIPELINE NODES                                        -->
    <!-- ===================================================== -->
    <g id="pipeline-nodes">
        <!-- Connection Line -->
        <line
            x1="30"
            y1="36"
            x2="210"
            y2="36"
            stroke="#3B82F6"
            stroke-width="1.0"
            stroke-opacity="0.55"/>
        <!-- ================================================= -->
        <!-- Commit Node                                       -->
        <!-- ================================================= -->
        <!-- Glow -->
        <circle
            cx="34"
            cy="36"
            r="3.8"
            fill="#58A6FF"
            opacity="0.14">
            <animate
                attributeName="opacity"
                values="0.08;0.18;0.08"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- Main Node -->
        <circle
            cx="34"
            cy="36"
            r="2.5"
            fill="#58A6FF">
            <animate
                attributeName="r"
                values="2.5;3;2.5"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- ================================================= -->
        <!-- CI Node                                           -->
        <!-- ================================================= -->
        <!-- Glow -->
        <circle
            cx="90"
            cy="36"
            r="3.8"
            fill="#58A6FF"
            opacity="0.14">
            <animate
                attributeName="opacity"
                values="0.08;0.18;0.08"
                begin="0.4s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- Main Node -->
        <circle
            cx="90"
            cy="36"
            r="2.5"
            fill="#58A6FF">
            <animate
                attributeName="r"
                values="2.5;3;2.5"
                begin="0.4s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- ================================================= -->
        <!-- CD Node                                           -->
        <!-- ================================================= -->
        <!-- Glow -->
        <circle
            cx="150"
            cy="36"
            r="3.8"
            fill="#58A6FF"
            opacity="0.14">
            <animate
                attributeName="opacity"
                values="0.08;0.18;0.08"
                begin="0.8s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- Main Node -->
        <circle
            cx="150"
            cy="36"
            r="2.5"
            fill="#58A6FF">
            <animate
                attributeName="r"
                values="2.5;3;2.5"
                begin="0.8s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- ================================================= -->
        <!-- Deploy Node                                       -->
        <!-- ================================================= -->
        <!-- Glow -->
        <circle cx="206" cy="36" r="3.8" fill="#58A6FF" opacity="0.14">
            <animate
                attributeName="fill"
                values="#58A6FF;#58A6FF;#3FB950;#58A6FF;#58A6FF"
                keyTimes="0;0.80;0.85;0.90;1"
                dur="6s"
                repeatCount="indefinite"/>
            <animate
                attributeName="opacity"
                values="0.08;0.18;0.08"
                begin="1.2s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
        <!-- Main Node -->
        <circle cx="206" cy="36" r="2.5" fill="#58A6FF">
            <animate
                attributeName="fill"
                values="#58A6FF;#58A6FF;#3FB950;#58A6FF;#58A6FF"
                keyTimes="0;0.80;0.85;0.90;1"
                dur="6s"
                repeatCount="indefinite"/>
            <animate
                attributeName="r"
                values="2.5;3.2;2.5"
                begin="1.2s"
                dur="2.8s"
                repeatCount="indefinite"/>
        </circle>
    </g>
    <!-- ===================================================== -->
    <!-- PIPELINE LABELS                                       -->
    <!-- ===================================================== -->
    <g id="pipeline-labels"
       font-family="Segoe UI, Arial, sans-serif"
       font-size="8"
       font-weight="500"
       fill="#8B949E"
       text-anchor="middle">
        <text
            x="34"
            y="52">
            Commit
        </text>
        <text
            x="90"
            y="52">
            CI
        </text>
        <text
            x="150"
            y="52">
            CD
        </text>
        <text x="206" y="52" font-weight="600">
            Deploy
            <animate
                attributeName="fill"
                values="#8B949E;#8B949E;#3FB950;#8B949E;#8B949E"
                keyTimes="0;0.80;0.85;0.90;1"
                dur="6s"
                repeatCount="indefinite"/>
        </text>
        <text x="221" y="52" font-size="7" font-weight="700" fill="#3FB950" opacity="0">
            ✔
            <animate
                attributeName="opacity"
                values="0;0;1;0;0"
                keyTimes="0;0.80;0.85;0.90;1"
                dur="6s"
                repeatCount="indefinite"/>
        </text>
    </g>
    <!-- ===================================================== -->
    <!-- PAC-MAN                                               -->
    <!-- ===================================================== -->
    <g id="pacman">
        <text
            id="pacman-icon"
            x="28"
            y="58"
            font-family="'Segoe UI Symbol','Segoe UI','Arial Unicode MS',sans-serif"
            font-size="11"
            font-weight="600"
            fill="#FFC83D"
            dominant-baseline="middle">
            ᗧ
        </text>
            <animateTransform
                attributeName="transform"
                attributeType="XML"
                type="translate"
                values="
                    0 0;
                    90 0;
                    175 0;
                    0 0"
                keyTimes="
                    0;
                    0.38;
                    0.85;
                    1"
                calcMode="spline"
                keySplines="
                    0.35 0 0.65 1;
                    0.35 0 0.65 1;
                    0.35 0 0.65 1"
                dur="6s"
                repeatCount="indefinite"/>
            <animate
                attributeName="opacity"
                values="
                    0;
                    0;
                    1;
                    1;
                    1;
                    0;
                    0;
                    0"
                keyTimes="
                    0;
                    0.05;
                    0.08;
                    0.82;
                    0.85;
                    0.86;
                    0.99;
                    1"
                dur="6s"
                repeatCount="indefinite"/>
    </g>
    <!-- ===================================================== -->
    <!-- DOTS                                                  -->
    <!-- ===================================================== -->
    <g
        id="pacman-dots"
        fill="#8B949E"
        fill-opacity="0.35">
        <!-- DOT 0 -->
        <circle cx="34" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.01;0.03;0.05;1"/>
        </circle>
        <!-- DOT 1 -->
        <circle cx="46" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.06;0.08;0.10;1"/>
        </circle>
        <!-- DOT 2 -->
        <circle cx="57" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.11;0.13;0.15;1"/>
        </circle>
        <!-- DOT 3 -->
        <circle cx="69" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.16;0.18;0.20;1"/>
        </circle>
        <!-- DOT 4 -->
        <circle cx="80" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.21;0.23;0.25;1"/>
        </circle>
        <!-- DOT 5 -->
        <circle
            cx="92"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.26;0.28;0.30;1"/>
        </circle>
        <!-- DOT 6 -->
        <circle
            cx="103"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.31;0.33;0.35;1"/>
        </circle>
        <!-- DOT 7 -->
        <circle
            cx="115"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.36;0.38;0.40;1"/>
        </circle>
        <!-- DOT 8 -->
        <circle
            cx="126"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.42;0.44;0.46;1"/>
        </circle>
        <!-- DOT 9 -->
        <circle
            cx="138"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.48;0.50;0.52;1"/>
        </circle>
        <!-- DOT 10 -->
        <circle
            cx="149"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.54;0.56;0.58;1"/>
        </circle>
        <!-- DOT 11 -->
        <circle
            cx="161"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.60;0.62;0.64;1"/>
        </circle>
        <!-- DOT 12 -->
        <circle
            cx="172"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.67;0.69;0.71;1"/>
        </circle>
        <!-- DOT 13 -->
        <circle
            cx="184"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.74;0.76;0.78;1"/>
        </circle>
        <!-- DOT 14 -->
        <circle
            cx="195"
            cy="58"
            r="1.6"
            fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.81;0.83;0.85;1"/>
        </circle>
        <!-- DOT 15 -->
        <circle cx="206" cy="58" r="1.6" fill="#C9D1D9" opacity="0.45">
            <animate
                attributeName="opacity"
                dur="6s"
                repeatCount="indefinite"
                values="1;1;0.35;0;0"
                keyTimes="0;0.86;0.88;0.90;1"/>
        </circle>
    </g>
    <!-- ===================================================== -->
    <!-- FINAL POLISH                                          -->
    <!-- ===================================================== -->
    <!-- Top Highlight -->
    <line
        x1="12"
        y1="8"
        x2="228"
        y2="8"
        stroke="#FFFFFF"
        stroke-opacity="0.04"
        stroke-width="1"/>
    <!-- Bottom Shadow -->
    <line
        x1="12"
        y1="62"
        x2="228"
        y2="62"
        stroke="#000000"
        stroke-opacity="0.18"
        stroke-width="1"/>
    <!-- Left Accent -->
    <line
        x1="12"
        y1="12"
        x2="12"
        y2="58"
        stroke="#58A6FF"
        stroke-opacity="0.08"
        stroke-width="1"/>
    <!-- Right Accent -->
    <line
        x1="228"
        y1="12"
        x2="228"
        y2="58"
        stroke="#58A6FF"
        stroke-opacity="0.08"
        stroke-width="1"/>
    <!-- Very Light Scan Line -->
    <rect
        x="8"
        y="0"
        width="224"
        height="1"
        fill="#58A6FF"
        opacity="0.05">
        <animate
            attributeName="y"
            values="0;70;0"
            dur="10s"
            repeatCount="indefinite"/>
    </rect>
</svg>
