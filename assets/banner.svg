<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="320"
    viewBox="0 0 1200 320">
    <!-- ===================================================== -->
    <!-- DEFINITIONS                                           -->
    <!-- ===================================================== -->
    <defs>
        <!-- Background Gradient                              -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0D1117"/>
            <stop offset="100%" stop-color="#161B22"/>
        </linearGradient>
        <!-- Glass Gradient                                   -->
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
        </linearGradient>
        <!-- Enterprise Blue                                  -->
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#58A6FF"/>
            <stop offset="100%" stop-color="#7CC4FF"/>
        </linearGradient>
        <!-- Border                                            -->
        <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#30363D"/>
            <stop offset="50%" stop-color="#3B4450"/>
            <stop offset="100%" stop-color="#30363D"/>
        </linearGradient>
        <!-- Soft Glow                                         -->
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Blue Glow                                         -->
        <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Packet Glow                                      -->
        <!-- Using for Packet-->
        <filter id="packetGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Grid Pattern                                      -->
        <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0 L0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" opacity="0.35"/>
        </pattern>
        <!-- Dot Pattern                                       -->
        <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.20"/>
        </pattern>
        <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF">
                <animate attributeName="stop-color" values="#FFFFFF;#8BD5FF;#FFFFFF" dur="6s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#58A6FF">
                <animate attributeName="stop-color" values="#58A6FF;#8A6BFF;#58A6FF" dur="6s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>
    </defs>
    <!-- BACKGROUND                                            -->
    <rect width="1200" height="320" fill="url(#bgGradient)"/>
    <!-- GRID LAYER                                            -->
    <rect width="1200" height="320" fill="url(#gridPattern)" opacity="0.35"/>
    <!-- DOT LAYER                                             -->
    <rect width="1200" height="320" fill="url(#dotPattern)" opacity="0.15"/>
    <!-- SUBTLE VIGNETTE                                       -->
    <rect width="1200" height="320" fill="#000000" opacity="0.08"/>
    <!-- GLASS CARD                                            -->
    <rect x="24" y="20" width="1152" height="280" rx="18" ry="18" fill="url(#glassGradient)" stroke="url(#borderGradient)" stroke-width="1.2" stroke-opacity="0.55"/>
    <!-- INNER SHADOW                                           -->
    <rect x="36" y="32" width="1128" height="256" rx="14" ry="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    <!-- LEFT GLOW                                             -->
    <circle cx="170" cy="160" r="105" fill="#58A6FF" opacity="0.035" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.03;0.06;0.03" dur="9s" repeatCount="indefinite"/>
    </circle>
    <!-- RIGHT GLOW                                            -->
    <circle cx="1030" cy="160" r="105" fill="#58A6FF" opacity="0.035" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.03;0.06;0.03" dur="9s" repeatCount="indefinite"/>
    </circle>
    <!-- TOP LIGHT                                             -->
    <line x1="60" y1="42" x2="1140" y2="42" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    <!-- BOTTOM SHADOW                                         -->
    <line x1="60" y1="278" x2="1140" y2="278" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
    <!-- CONTENT START                                         -->
    <!--
        PART 2
        Enterprise Network
        Animated Nodes
        Data Flow
        API Gateway Diagram
    -->
    <!-- ===================================================== -->
    <!-- ENTERPRISE NETWORK                                    -->
    <!-- ===================================================== -->
    <g id="network">
        <!-- CONNECTIONS           -->
        <path id="flow1" d="M170 95 L310 95 L420 140" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <path id="flow2" d="M420 140 L580 80" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <path id="flow3" d="M580 80 L760 90" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <path id="flow4" d="M580 80 L760 190" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <path id="flow5" d="M760 90 L920 90" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <path id="flow6" d="M760 190 L920 190" fill="none" stroke="#2F81F7" stroke-opacity="0.14" stroke-width="2"/>
        <!-- GATEWAY               -->
        <circle cx="170" cy="95" r="7" fill="#58A6FF" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8;7" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- SPRING BOOT           -->
        <circle cx="310" cy="95" r="7" fill="#6DB33F" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8;7" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <!-- MICROSERVICE HUB      -->
        <circle cx="420" cy="140" r="8" fill="#58A6FF" filter="url(#blueGlow)">
            <animate attributeName="r" values="8;9;8" dur="3s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <!-- SERVICE BUS           -->
        <circle cx="580" cy="80" r="8" fill="#58A6FF" filter="url(#blueGlow)">
            <animate attributeName="r" values="8;9;8" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <!-- KAFKA -->
        <circle cx="760" cy="90" r="7" fill="#ED8B00" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8.6;7" dur="3s" begin="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".65;1;.65" dur="3s" begin="2s" repeatCount="indefinite"/>
        </circle>
        <!-- REDIS                 -->
        <circle cx="760" cy="190" r="7" fill="#DC2626" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8.6;7" dur="3s" begin="2.3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".65;1;.65" dur="3s" begin="2.3s" repeatCount="indefinite"/>
        </circle>
        <!-- DATABASE              -->
        <circle cx="920" cy="90" r="7" fill="#3FB950" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8.6;7" dur="3s" begin="2.6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".65;1;.65" dur="3s" begin="2.6s" repeatCount="indefinite"/>
        </circle>
        <!-- KUBERNETES            -->
        <circle cx="920" cy="190" r="7" fill="#7C3AED" filter="url(#blueGlow)">
            <animate attributeName="r" values="7;8.6;7" dur="3s" begin="2.9s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".65;1;.65" dur="3s" begin="2.9s" repeatCount="indefinite"/>
        </circle>
    </g>
    <!-- ===================================================== -->
    <!-- ANIMATION PATHS (Invisible)                           -->
    <!-- ===================================================== -->
    <!-- Full flow : API -> DATABASE -->
    <path id="flowFullTop" d="M170 95 L310 95 L420 140 L580 80 L760 90 L920 90" fill="none" stroke="none"/> <!--This path is not visible; it's only for packet execution.-->
    <!-- Full flow : BUS -> REDIS -> K8S -->
    <path id="flowFullBottom" d="M580 80 L760 190 L920 190" fill="none" stroke="none"/>
    <!-- API -> SPRING -> SERVICE -> BUS -> KAFKA -> DATABASE -->
    <g>
        <!-- Packet 1 -->
        <circle r="4.6" fill="#8BD5FF" filter="url(#packetGlow)">
            <animate attributeName="r" values="4.0;5.8;4.0" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;1;.6" dur="1.5s" repeatCount="indefinite"/>
            <animateMotion dur="7.5s" begin="0s" repeatCount="indefinite">
                <mpath href="#flowFullTop"/>
            </animateMotion>
        </circle>
        <!-- Packet 2 -->
        <circle r="4.6" fill="#8BD5FF" filter="url(#packetGlow)">
            <animate attributeName="r" values="4.0;5.8;4.0" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;1;.6" dur="1.5s" repeatCount="indefinite"/>
            <animateMotion dur="9s" begin="2.1s" repeatCount="indefinite">
                <mpath href="#flowFullTop"/>
            </animateMotion>
        </circle>
        <!-- Packet 3 -->
        <circle r="4.6" fill="#8BD5FF" filter="url(#packetGlow)">
            <animate attributeName="r" values="4.0;5.8;4.0" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;1;.6" dur="1.5s" repeatCount="indefinite"/>
            <animateMotion dur="6.2s" begin="1.4s" repeatCount="indefinite">
                <mpath href="#flowFullBottom"/>
            </animateMotion>
        </circle>
    </g>
    <!-- ===================================================== -->
    <!-- LABELS                                                -->
    <!-- ===================================================== -->
    <g font-family="Segoe UI" font-size="12" fill="#8B949E" letter-spacing="1">
        <text x="145" y="78">API</text>
        <text x="280" y="78">SPRING</text>
        <text x="385" y="123">SERVICE</text>
        <text x="548" y="63">BUS</text>
        <text x="738" y="72">KAFKA</text>
        <text x="739" y="210">REDIS</text>
        <text x="894" y="72">DATABASE</text>
        <text x="872" y="210">K8S</text>
    </g>
    <!-- NETWORK AMBIENT LINES                                -->
    <g opacity="0.15">
        <line x1="120" y1="250" x2="360" y2="250" stroke="#30363D"/>
        <line x1="800" y1="60" x2="1080" y2="60" stroke="#30363D"/>
        <line x1="860" y1="240" x2="1090" y2="240" stroke="#30363D"/>
    </g>
    <!-- ===================================================== -->
    <!-- TYPOGRAPHY                                            -->
    <!-- ===================================================== -->
    <g id="typography">
        <!-- Glow -->
        <text x="600" y="160" text-anchor="middle" font-family="Orbitron, Exo 2" font-size="58" font-weight="900" letter-spacing="7" fill="#58A6FF" opacity=".18" filter="url(#softGlow)">
            PHELIM
        </text>
        <!-- Main Title -->
        <text x="600" y="160" text-anchor="middle" font-family="Orbitron, Exo 2, Rajdhani, Space Grotesk" font-size="54" font-weight="900" letter-spacing="7" fill="url(#titleGradient)" filter="url(#blueGlow)">
            PHELIM
            <animate attributeName="letter-spacing" values="6;8;6" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".88;1;.88" dur="4s" repeatCount="indefinite"/>
        </text>
        <!-- Accent Line -->
        <line x1="505" y1="174" x2="695" y2="174" stroke="#58A6FF" stroke-width="2" stroke-linecap="round">
            <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
        </line>
        <!-- Subtitle -->
        <text x="600" y="202" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#58A6FF" letter-spacing="1">Java Backend Engineer</text>
        <!-- Description -->
        <text x="600" y="228" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#8B949E">Spring Boot • Microservices • Cloud Native</text>
    </g>
    <!-- ===================================================== -->
    <!-- STATUS BADGES                                         -->
    <!-- ===================================================== -->
    <g font-family="Segoe UI" font-size="12">
        <!-- Java -->
        <rect x="960" y="118" width="95" height="26" rx="11" fill="#1B222C" stroke="#3B4450"/>
        <circle cx="974" cy="131" r="4" fill="#3FB950"/>
        <text x="986" y="135" fill="#E6EDF3">JAVA 21</text>
        <!-- Spring -->
        <rect x="960" y="152" width="96" height="26" rx="11" fill="#1B222C" stroke="#3B4450"/>
        <circle cx="974" cy="165" r="4" fill="#3FB950"/>
        <text x="986" y="169" fill="#E6EDF3">SPRING</text>
        <!-- Cloud -->
        <rect x="960" y="186" width="96" height="26" rx="11" fill="#1B222C" stroke="#3B4450"/>
        <circle cx="974" cy="199" r="4" fill="#3FB950"/>
        <text x="986" y="203" fill="#E6EDF3">CLOUD</text>
        <!-- Kafka -->
        <rect x="960" y="220" width="96" height="26" rx="11" fill="#1B222C" stroke="#3B4450"/>
        <circle cx="974" cy="233" r="4" fill="#3FB950"/>
        <text x="986" y="237" fill="#E6EDF3">KAFKA</text>
    </g>
    <!-- BUILD STATUS                                          -->
    <g font-family="Consolas" font-size="12">
        <circle cx="70" cy="55" r="4" fill="#3FB950">
            <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="82" y="59" fill="#8B949E">SYSTEM ONLINE</text>
    </g>
    <!-- SCAN LINE                                             -->
    <rect x="36" y="40" width="1128" height="1" fill="#58A6FF" opacity=".05">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 235;0 0" dur="10s" repeatCount="indefinite"/>
    </rect>
    <!-- DECORATIVE CORNERS                                    -->
    <g stroke="#30363D" stroke-width="1">
        <path d="M55 55 h18"/>
        <path d="M55 55 v18"/>
        <path d="M1145 55 h-18"/>
        <path d="M1145 55 v18"/>
        <path d="M55 265 h18"/>
        <path d="M55 265 v-18"/>
        <path d="M1145 265 h-18"/>
        <path d="M1145 265 v-18"/>
    </g>
    <!-- VERSION                                               -->
    <text x="1110" y="285" text-anchor="end" font-family="Consolas" font-size="11" fill="#6E7681">© 2026 PHELIM</text>
</svg>
